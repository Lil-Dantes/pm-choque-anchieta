<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Comissão • PM Anchieta</title><link rel="stylesheet" href="/style.css"></head><body><main class="shell"><header class="brand"><img src="/logo.svg"><div><small>ÁREA RESTRITA</small><h1>COMISSÃO</h1><p>Resultados</p></div></header><section id="login" class="card"><b class="tag">ACESSO ADMINISTRATIVO</b><h2>Resultados</h2><label>Senha administrativa<input id="pw" type="password"></label><button id="loginBtn" class="primary">ENTRAR</button><div id="err" class="error"></div></section><section id="panel" class="card hidden"><div class="adminHead"><div><b class="tag">RESULTADOS</b><h2>Candidatos</h2></div><div><button id="refresh" class="secondary">ATUALIZAR</button><button id="csv" class="secondary">EXPORTAR CSV</button><button id="clear" class="danger">LIMPAR</button></div></div><div id="stats" class="stats"></div><div class="table"><table><thead><tr><th>Nome</th><th>ID</th><th>Patente/Grad.</th><th>Disponibilidade</th><th>Acertos</th><th>%</th><th>Status</th><th>Início</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><footer>Área administrativa • PM ANCHIETA CHOQUE</footer><script>
let pw="",data=[],$=x=>document.getElementById(x);$("loginBtn").onclick=()=>{pw=$("pw").value;load()};$("refresh").onclick=load;async function load(){let r=await fetch("/api/admin/results",{headers:{"x-admin-password":pw}}),d=await r.json();if(!r.ok){$("err").textContent=d.error;return}data=d;$("login").classList.add("hidden");$("panel").classList.remove("hidden");let c=d.filter(x=>x.status==="Concluído").length;$("stats").innerHTML=`<div><b>${d.length}</b><small>Candidatos</small></div><div><b>${c}</b><small>Concluídos</small></div><div><b>${d.length-c}</b><small>Em andamento</small></div>`;$("rows").innerHTML=d.map(x=>`<tr><td>${e(x.name)}</td><td>${e(x.candidate_id)}</td><td>${e(x.rank)}</td><td>${e(x.availability)}</td><td>${x.score}/${x.total}</td><td>${x.percentage}%</td><td>${x.status}</td><td>${new Date(x.created_at).toLocaleString("pt-BR")}</td></tr>`).join("")||'<tr><td colspan="8">Nenhum candidato.</td></tr>'}function e(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}$("clear").onclick=async()=>{if(confirm("Apagar TODOS os resultados?")){await fetch("/api/admin/clear",{method:"POST",headers:{"x-admin-password":pw}});load()}};$("csv").onclick=()=>{let h=["Nome","ID","Patente/Graduação","Disponibilidade","Acertos","Total","Porcentagem","Status","Início"],rows=data.map(x=>[x.name,x.candidate_id,x.rank,x.availability,x.score,x.total,x.percentage+"%",x.status,new Date(x.created_at).toLocaleString("pt-BR")]);let s=[h,...rows].map(r=>r.map(v=>`"${String(v??"").replaceAll('"','""')}"`).join(";")).join("\\n");let a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\\ufeff"+s],{type:"text/csv"}));a.download="resultados_pm_anchieta.csv";a.click()};
</script></body></html>
